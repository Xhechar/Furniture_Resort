<app-notifications></app-notifications>
<div class="top-bar">
    <h2>{{parent}}&nbsp;><span> {{child}}</span></h2>
  <div class="profile-area">
    <nav>
      <ul>
        <li><i class='bx bx-home-smile' ></i></li>
        <li><i class='bx bx-notification' ></i></li>
        <li><i class='bx bx-cart-alt' ></i></li>
      </ul>
    </nav>
    <div class="profile">
      <div class="name-and-date">
        <h3>{{user ? user.Fullname : 'Collins Ongolo'}}</h3>
        <p>{{now | date : 'fullDate'}}</p>
      </div>
      <div class="img-container">
        <img [src]="user.ProfileImage" alt="profile">
      </div>
    </div>
  </div>
</div>

<app-notifications></app-notifications>
<div class="logout-modal-container" [ngClass]="{'active': isVisible}">
    <div class="logout-modal-backdrop" (click)="cancel()"></div>
    <div class="logout-modal">
        <div class="logout-modal-content" *ngIf="!isLoggingOut">
            <div class="logout-icon">
                <i class="bx bx-log-out-circle"></i>
            </div>
            <h2>Log Out</h2>
            <p>Are you sure you want to log out of your account?</p>
            <div class="logout-modal-buttons">
                <button (click)="cancel()" class="cancel-button">
                    <i class="bx bx-x"></i>
                    <span>Cancel</span>
                </button>
                <button (click)="logout()" class="logout-button">
                    <i class="bx bx-log-out"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </div>

        <div class="logout-success" [ngClass]="{'active': isLoggingOut}">
            <div *ngIf="!logoutComplete" class="logout-spinner"></div>
            <i *ngIf="logoutComplete" class="bx bx-loader bx-spin bx-rotate-180"></i>
            <p>{{ logoutMessage }}</p>
        </div>
    </div>
</div>

<app-logout></app-logout>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo-text">
      <h1>Ndagani SF</h1>
      <p>Smart Furniture</p>
    </div>
  </div>
  <div class="sidebar-content">
    <ul class="menu">
      <li class="menu-item" (click)="setIndex(i)" *ngFor="let menu of menuItems, let i = index"
        [routerLink]="menu.route" [class.active]="selectedIndex === i">
        <div class="icon-box">
          <i [ngClass]="menu.icon"></i>
        </div>
        <span class="menu-text">{{menu.value}}</span>
      </li>
    </ul>
    <li class="menu-item" (click)="displayLogoutModal()">
      <div class="icon-box">
        <i class="bx bxs-log-out"></i>
      </div>
      <span class="menu-text">Logout</span>
    </li>
  </div>
</div>
